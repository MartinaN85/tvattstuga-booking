<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tvättstugebokning</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="loginPage">

    <h1>Tvättstugebokning</h1>

    <div class="login-container">
        <h2>Logga in</h2>

        <input
                type="text"
                id="userId"
                placeholder="E-post">

        <button id="loginButton">
            Logga in
        </button>
    </div>

</div>


<div id="bookingPage" class="hidden">

    <h1>Tvättstugebokning</h1>

    <div class="user-bar">
        <p id="welcomeText"></p>

        <button id="logoutButton">
            Logga ut
        </button>
    </div>


    <div id="weekNavigation">

        <button id="previousWeek">
            ← Föregående vecka
        </button>

        <span id="weekLabel"></span>

        <button id="nextWeek">
            Nästa vecka →
        </button>

    </div>

    <div id="calendar"></div>

    <div class="legend">
        <span class="legend-item">
            <span class="legend-color available-color"></span>
            Ledig
        </span>

        <span class="legend-item">
            <span class="legend-color booked-color"></span>
            Bokad
        </span>
    </div>

    <h2>Mina bokningar</h2>

    <ul id="bookingList"></ul>


</div>


<script src="script.js"></script>

</body>
</html>
