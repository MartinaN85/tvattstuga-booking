name: CI

on:
  pull_request:
    branches:
      - dev

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and Test
        run: ./mvnw clean test


  e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build application
        run: ./mvnw package -DskipTests

      - name: Install Playwright Chromium
        run: |
          ./mvnw exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium"

      - name: Start Spring Boot
        run: |
          nohup java -jar target/*.jar > spring-boot.log 2>&1 &

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080 > /dev/null; then
              echo "Spring Boot is ready"
              exit 0
            fi

            sleep 2
          done

          echo "Spring Boot failed to start"
          cat spring-boot.log
          exit 1

      - name: Run E2E tests
        run: ./mvnw -Dtest=BookingE2E test

      - name: Show Spring Boot log on failure
        if: failure()
        run: cat spring-boot.log